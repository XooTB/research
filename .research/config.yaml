# Research agent configuration.
# Paths are relative to the workspace root unless absolute.

paths:
  papers_dir: papers
  datasets_dir: datasets
  db_path: .research/library.db
  bib_path: .research/references.bib

papers:
  # Sources queried by papers_search.py. Order is used for display grouping.
  sources: [pubmed, semantic_scholar, arxiv, openalex]
  default_limit: 15            # results per source
  criteria_depth: abstract     # abstract | fulltext (fulltext not yet implemented)

datasets:
  sources: [huggingface, kaggle, zenodo, direct]
  default_limit: 15
  free_only: true              # never surface paywalled datasets
  verify_sample_rows: 1000     # rows to sample when profiling large files

colab:
  # Colab sessions are driven from the terminal by agent/scripts/colab_sync.py,
  # which wraps Google's colab CLI (uv tool install google-colab-cli). Code and
  # datasets upload from the local working tree; nothing is cloned or pushed.
  auth: oauth2                 # oauth2 | adc — must match how the CLI was authenticated
  session: research            # default session name
  gpu: T4                      # requested by `start`; falls back to CPU if not granted
  # Where the workspace lives on the runtime (ephemeral disk).
  runtime_dir: /content/research
  # Always synced (incrementally). Datasets are added per session with --dataset.
  # The validation ledger rides along so the runtime refuses to re-score a candidate.
  sync_paths: [agent, notebooks, .research/config.yaml, .research/validation-ledger.jsonl]
  requirements: agent/requirements-colab.txt   # pip-installed on the runtime when it changes
  exec_timeout: 3600           # seconds for `run`; longer work goes through `job`
  upload_chunk_mb: 40
  default_topic: ovarian-cancer-prognosis-ml

credentials:
  # Optional. Left blank = anonymous access (rate-limited but functional).
  semantic_scholar_api_key: ""
  # PubMed/NCBI Entrez politeness: identify yourself to raise rate limits.
  ncbi_email: ""
  ncbi_api_key: ""
  # Kaggle reads ~/.kaggle/kaggle.json by default; nothing needed here.
  # Hugging Face reads HF_TOKEN env / ~/.cache/huggingface for gated datasets.
